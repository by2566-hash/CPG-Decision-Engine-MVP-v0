name: CPG Decision Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff requests jsonschema

    - name: Lint with Ruff
      run: |
        # Ignore line lengths and missing docstrings for MVP
        ruff check --ignore E501,D100 .

    - name: Validate JSON Schemas
      run: |
        # Minimal schema sanity check (ensures they are parsable)
        python -c "import json, glob; [json.load(open(f)) for f in glob.glob('CONTRACTS/*.json')]"

    - name: Run PyTest (Unit Tests)
      run: |
        PYTHONPATH=. pytest tests/ -v -k "not test_runner_api_smoke"

    - name: Runner API Smoke Test (End-to-End)
      env:
        RUNNER_API_KEY: "smoke_test_key"
        DISABLE_SECURITY: "false"
      run: |
        # Start the FastAPI runner in the background
        uvicorn runner_api.app:app --host 127.0.0.1 --port 8000 &
        UVICORN_PID=$!
        
        # Give it a second to boot
        python -c "import time; time.sleep(2)"
        
        # Execute the smoke test script
        PYTHONPATH=. python tests/test_runner_api_smoke.py
        
        # Cleanup
        kill $UVICORN_PID
